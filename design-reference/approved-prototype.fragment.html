  else if(['edit','supplement','write'].includes(action))showEditor(action);
  else if(action==='mood')openSheet('此刻的心情','<div class="dp-mood-grid">'+['开心','平静','低落','焦虑','生气','疲惫'].map(m=>'<button data-mood="'+m+'" aria-pressed="'+(diary().mood===m)+'">'+m+'</button>').join('')+'</div><p>可以不选，再点一次已选心情即可取消。</p>',b);
  else if(action==='entry-menu'){const d=diary();openSheet('这条日记','<button class="dp-row" data-action="date"><span>修改日期</span>'+icon('calendar-days')+'</button><label class="dp-row"><span>参与 AI<small>允许后续日记对话取用这条记录</small></span><input type="checkbox" data-ai '+(d.ai?'checked':'')+' aria-label="参与 AI"></label><p>关闭后，已有聊天中的引用仍然保留。</p><button class="dp-row dp-danger" data-action="delete-entry">删除日记'+icon('trash-2')+'</button>',b);}
  else if(action==='date')openSheet('修改日期','<label class="dp-field">日记日期<input type="date" aria-label="日记日期" value="'+diary().date+'"></label><button class="dp-primary" data-action="save-date">完成</button>');
  else if(action==='save-date'){const value=sheet.querySelector('input').value;if(value)diary().date=value;closeSheet();draw('detail');}
  else if(action==='delete-entry')openSheet('删除这条日记？','<p>文字、转写和原始录音会一起删除，无法恢复。此处仅操作演示数据。</p><button class="dp-primary dp-danger" data-action="confirm-delete-entry">删除日记</button>');
  else if(action==='confirm-delete-entry'){const index=diaries.findIndex(d=>d.id===state.diaryId);if(index>=0)diaries.splice(index,1);closeSheet();draw(state.returnPage==='chat'?'chat':'diary');}
  else if(action==='new-chat'){state.chatId=null;state.newScope='';state.newModel='日常模型';state.draft='';draw('chat');}
  else if(action==='scope')openSheet('选择日记范围',['全部','今天','最近一周'].map(s=>'<button class="dp-row" data-scope="'+s+'">'+s+icon('chevron-right')+'</button>').join('')+'<button class="dp-row" data-action="custom-range">自选日期'+icon('calendar-days')+'</button>',b);
  else if(action==='custom-range')openSheet('自选日期','<label class="dp-field">开始<input type="date" name="start" value="2026-10-08"></label><label class="dp-field">结束<input type="date" name="end" value="2026-10-10"></label><p class="dp-range-error" aria-live="polite"></p><button class="dp-primary" data-action="save-range">使用这个范围</button>');
  else if(action==='save-range'){const start=sheet.querySelector('[name="start"]').value,end=sheet.querySelector('[name="end"]').value;if(!start||!end||start>end){sheet.querySelector('.dp-range-error').textContent='请选择有效的起止日期。';return;}state.newScope=dateLabel(start)+' – '+dateLabel(end);closeSheet();draw('chat');}
  else if(action==='model')openSheet('选择模型连接',state.models.map(m=>'<button class="dp-row" data-model="'+m+'">'+m+icon('chevron-right')+'</button>').join('')+'<p>这里展示已在「更多」中配置的模型连接。</p>',b);
  else if(action==='send')send();
  else if(action==='stop-reply'){stopGeneration();draw('chat');}
  else if(action==='chat-menu')openSheet('这段对话','<button class="dp-row dp-danger" data-action="delete-chat">删除整段对话'+icon('trash-2')+'</button>',b);
  else if(action==='delete-chat')openSheet('删除整段对话？','<p>聊天记录会被删除，日记仍然保留。此处仅操作演示数据。</p><button class="dp-primary dp-danger" data-action="confirm-delete-chat">删除对话</button>');
  else if(action==='confirm-delete-chat'){stopGeneration();const index=chats.findIndex(c=>c.id===state.chatId);if(index>=0)chats.splice(index,1);closeSheet();draw('threads');}
  else if(action==='record'){state.started=Date.now();draw('recording');}
  else if(action==='stop-record'){const d={id:Date.now(),date:'2026-10-10',time:'21:00',mood:'',audio:'00:'+Math.min(59,Math.floor((Date.now()-state.started)/1000)).toString().padStart(2,'0'),ai:true,text:['这是录音结束后的页面示例。原音会先保存，转写完成后自动显示在这里。'],extra:''};diaries.unshift(d);state.diaryId=d.id;state.returnPage='home';state.saved=true;draw('detail');}
  else if(action==='providers')openSheet('AI 服务商与模型',state.models.map((m,i)=>'<div class="dp-row"><span>'+m+'<small>'+(i===0?'默认连接':'备用连接')+'</small></span>'+icon('check')+'</div>').join('')+'<p>连接列表示例。实际配置包含名称、协议、服务地址、API Key 和模型名称。</p>',b);
  else if(action==='about')openSheet('关于 OneRecord','<p>留一点今天。</p><p>一个记录与回顾日常的地方。</p>',b);
 });
 shade.addEventListener('click',closeSheet);
 sheet.addEventListener('keydown',event=>{if(event.key==='Escape')closeSheet();if(event.key==='Tab'){const controls=[...sheet.querySelectorAll('button,input,textarea')];const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
 applyPalette();restorePalette(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',event=>restorePalette(event.detail?.globals?.widgetState));
 draw('home');
})();
</script>
</div>
