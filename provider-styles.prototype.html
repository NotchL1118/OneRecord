<style>

x auto 8px}.muted{color:var(--muted);font-size:12px;line-height:1.65}.hero{display:flex;align-items:center;justify-content:space-between;margin:8px 0 26px}.hero h2{margin-bottom:6px}.avatar{width:58px;height:58px;border-radius:50%;background:var(--peach);display:grid;place-items:center;flex-shrink:0}.blob{background:var(--yellow);border-radius:48% 49% 34% 36%;width:39px;height:32px;text-align:center;padding-top:5px;font-size:17px;letter-spacing:4px;padding-left:4px}.section-label{font-size:12px;color:var(--muted);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}.field{display:block;margin:0 0 17px}.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.field input,.field select{display:block;width:100%;background:white;border:1px solid var(--line);border-radius:13px;padding:13px 12px;outline:0;min-width:0}.field input:focus{border-color:#b39758}.field input[type=password]{letter-spacing:4px}.field select{font-size:13px}.primary{width:100%;background:var(--yellow);border-radius:17px;min-height:50px;padding:12px;font-weight:600}.secondary{border:1px solid var(--line);border-radius:15px;min-height:46px;width:100%;margin-top:10px;background:#fff9}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:13px 0}.row small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.row .arrow{font-size:22px;color:#a79d8e}.tag{font-size:10px;background:var(--tint);padding:4px 7px;border-radius:7px;white-space:nowrap}.note{padding:13px 15px;border-radius:14px;background:var(--tint);color:var(--muted);font-size:12px;line-height:1.6;margin-top:16px}.tools{display:flex;gap:8px;margin:14px 0}.tools button{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 5px;font-size:12px}.tools button:first-child{background:var(--tint)}.bare{font-size:12px;color:var(--muted);padding:12px 0}.tabs{display:flex;background:#f1ebde;border-radius:13px;padding:4px;gap:3px;margin:15px 0 24px}.tabs button{flex:1;padding:9px 4px;font-size:12px;border-radius:10px}.tabs .selected{background:var(--bg);box-shadow:0 2px 6px #443d3710}.summary{background:var(--tint);border-radius:24px;padding:23px;margin-bottom:23px}.summary .hero{margin:0 0 20px}.summary .mini{font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}.model-card{display:block;background:white;border:1px solid var(--line);border-radius:19px;width:100%;padding:18px;text-align:left;margin-bottom:12px}.model-card strong{display:block;margin-bottom:8px}.model-card small{display:block;color:var(--muted);font-size:11px}.model-card .meta{display:flex;justify-content:space-between;margin-top:16px}.fold{border-bottom:1px solid var(--line);padding:2px 0}.fold>button{display:flex;width:100%;text-align:left;align-items:center;gap:14px;padding:22px 0}.number{width:30px;height:30px;background:var(--yellow);border-radius:50%;display:grid;place-items:center;font-size:12px}.fold>button .desc{flex:1}.fold>button small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.fold-content{padding:0 0 15px 44px}.fold-content .field{margin-bottom:16px}.toggle{width:42px;height:25px;border-radius:20px;background:var(--yellow);padding:3px;display:inline-flex;justify-content:end}.toggle:after{content:'';height:19px;width:19px;border-radius:50%;background:white;box-shadow:0 1px 3px #443d3720}.toggle.off{background:#ddd5c7;justify-content:start}.effort{display:flex;gap:5px;margin:15px 0 4px}.effort button{flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:10px;font-size:12px}.effort .selected{background:var(--yellow);border-color:var(--yellow)}.test{text-align:center;padding:26px 0}.test .avatar{margin:0 auto 22px;width:80px;height:80px}.test h2{margin-bottom:10px}.test-result{background:var(--tint);padding:20px;border-radius:21px;margin:26px 0;text-align:left}.test-result p{font-size:14px;margin-top:12px}.check-row{background:white;border:1px solid var(--line);padding:18px 15px;border-radius:15px;margin:10px 0;display:flex;width:100%;text-align:left;justify-content:space-between}.check-row.checked{background:var(--tint);border-color:#d6b96d}.check-row small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.bottom-action{padding:14px 22px;background:var(--bg)}.navtabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:13px}.navtabs button{font-size:12px;color:var(--muted);line-height:1.7}.navtabs button:last-child{color:var(--ink);font-weight:700}.chat-hero{background:var(--tint);border-radius:20px;padding:19px;display:flex;align-items:center;gap:10px;margin:5px 0 24px}.chat-hero p{font-size:11px;color:var(--muted);margin-top:8px}.chatrow{border-bottom:1px solid var(--line);padding:18px 0}.chatrow h3{font-size:14px;margin-bottom:8px}.chatrow p{font-size:12px;color:var(--muted)}.chatrow .rowtop{display:flex;justify-content:space-between}.chatrow button{color:var(--red);font-size:12px}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff9eb;display:flex;gap:14px;align-items:center;padding:7px 12px;border-radius:40px;box-shadow:0 8px 25px #30271d30;z-index:5;white-space:nowrap}.switcher button{color:inherit;width:40px;height:38px;font-size:21px}.switcher span{font-size:13px;min-width:140px;text-align:center}.screens{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.screens button{padding:10px 12px;background:#f6f3ec;border-radius:10px;font-size:12px}.screens .active{background:var(--yellow)}.toast{position:absolute;bottom:35px;left:22px;right:22px;border-radius:14px;background:var(--ink);color:white;text-align:center;padding:13px;font-size:12px;z-index:4}.screen-title{font-size:11px;margin-top:25px;color:var(--muted)}@media(max-width:760px){.workspace{display:block;padding:25px 15px 110px}.intro{position:static;padding:0;max-width:390px;margin:auto}.intro h1{font-size:25px}.intro p{margin:12px 0}.choices{margin:16px 0}.features{display:none}.screens{margin:0 0 20px}.phone{width:min(390px,100%);margin:auto;height:790px}.screen-title{display:none}}
</style>
<div class="workspace"><aside class="intro"><div class="eyebrow">ONERECORD / 界面选择</div><h1 id="title"></h1><p id="description"></p><div class="choices"><button onclick="variant('A')">A · 轻手账</button><button onclick="variant('B')">B · 模型工作台</button><button onclick="variant('C')">C · 渐进设置</button></div><div class="features">同样的功能，三种信息组织方式<br>服务商与模型一起编辑，一次保存<br>API 获取模型 → 勾选添加 → 测试连接<br>思考默认开启，强度 Medium</div><div class="screen-title">也可以切换场景，查看完整操作</div><div class="screens"><button onclick="screen('provider')">服务商</button><button onclick="screen('model')">模型设置</button><button onclick="screen('test')">连接测试</button><button onclick="screen('chat')">对话列表</button></div><p style="font-size:11px">可交互样式原型 · 所有数据均为演示<br>不会保存配置或请求真实 API</p></aside><main class="phone"><div class="status"><span>9:41</span><span>▴  ▰  ▮</span></div><div class="nav" id="nav"></div><div class="content" id="content"></div><div id="footer"></div><div class="homebar"></div></main></div><div class="switcher"><button onclick="cycle(-1)" aria-label="上一种样式">←</button><span id="current"></span><button onclick="cycle(1)" aria-label="下一种样式">→</button></div>
<script>
const variants={A:['轻手账','服务信息与模型沿着一页展开。大标题、细分隔线和宽松留白，接近日记页面的阅读节奏。'],B:['模型工作台 + 步骤引导','已选方案：保留 B 的摘要与模型卡片，加入 ① 连接服务 → ② 选择模型 → ③ 测试连接。每一步说明现在做什么、接下来做什么。'],C:['渐进设置','把设置收成三个可展开的步骤。一次专注一件事，完成后留下简短摘要，页面更安静。']};
let v=new URLSearchParams(location.search).get('variant')||'B';if(!variants[v])v='A';let page='provider',tab='连接',fold=2,thinking=true,effort='Medium',out=false,testState='idle',selected=new Set(['deepseek-flash']),models=['DeepSeek Flash','DeepSeek V4 Pro'],deleted=false;
const $=s=>document.querySelector(s),avatar='<div class="avatar"><div class="blob">•ᴗ•</div></div>';
const field=(title,value,type='text')=>`<label class="field"><span>${title}</span><input type="${type}" value="${value}"></label>`;
function info(){return field('服务商名称','我的 AI 服务')+`<label class="field"><span>API 格式</span><select><option>OpenAI Chat Completions</option><option>OpenAI Responses</option><option>Anthropic Messages</option></select></label>`+field('Base URL','https://api.example.com/v1')+field('API Key','demo-key','password')+`<details><summary class="bare">更多认证设置</summary><label class="field"><span>认证方式</span><select><option>API Key</option><option>无需认证</option><option>自定义请求头</option></select></label>${field('自定义请求头','')}</details>`}
function modelList(cards=false){return models.map((m,i)=>cards?`<button class="model-card" onclick="screen('model')"><strong>${m}</strong><small>${i?'deepseek-v4-pro':'deepseek-flash'}</small><div class="meta"><span class="tag">思考 · Medium</span><span>↗</span></div></button>`:`<button class="row" onclick="screen('model')"><span>${m}<small>${i?'deepseek-v4-pro':'deepseek-flash'}</small></span><span class="arrow">›</span></button>`).join('')}
function modelTools(){return `<div class="tools"><button onclick="screen('discover')">↓ 获取模型列表</button><button onclick="screen('manual')">＋ 手动添加</button></div>`}
function variant(key){v=key;page='provider';const u=new URL(location);u.searchParams.set('variant',key);history.replaceState(null,'',u);render()}
function cycle(n){variant(['A','B','C'][(['A','B','C'].indexOf(v)+n+3)%3])}function screen(key){page=key;render()}
function save(){toast('演示：服务商与 '+models.length+' 个模型已一起保存')}
function toast(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;$('.phone').append(el);setTimeout(()=>el.remove(),2400)}
function nav(title,action='保存',code='save()'){ $('#nav').innerHTML=`<button class="back" onclick="screen('provider')" aria-label="返回">‹</button><strong>${title}</strong><button class="save" onclick="${code}">${action}</button>`}
function render(){ $('#title').textContent=v+' · '+variants[v][0];$('#description').textContent=variants[v][1];$('#current').textContent=v+' / '+variants[v][0];document.querySelectorAll('.choices button').forEach((b,i)=>b.classList.toggle('active',i===['A','B','C'].indexOf(v)));document.querySelectorAll('.screens button').forEach((b,i)=>b.classList.toggle('active',['provider','model','test','chat'][i]===page));$('#footer').innerHTML='';let html='';
if(page==='provider'){nav('服务商设置');
if(v==='A')html=`<div class="hero"><div><h2>我的 AI 服务</h2><p class="muted">为每一次对话，选好伙伴。</p></div>${avatar}</div><div class="section-label">连接信息</div>${info()}<div class="section-label">我的模型 <span>${models.length} 个</span></div>${modelList()}${modelTools()}<button class="secondary" onclick="screen('test')">⌁ 测试连接</button>`;
if(v==='B')html=`<div class="summary"><div class="hero"><div><h2>我的 AI 服务</h2><p class="muted">OpenAI Chat Completions</p></div>${avatar}</div><div class="mini"><span>api.example.com</span><span>${models.length} 个模型</span></div></div><div class="tabs">${['连接','模型','测试'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${({'连接':'① 连接服务','模型':'② 选择模型','测试':'③ 测试连接'})[t]}</button>`).join('')}</div><p class="muted" style="margin-bottom:18px">${tab==='连接'?'第一步：先填写地址与密钥。':tab==='模型'?'第二步：获取列表，选择用于对话的模型。':'第三步：发一句问候，确认模型可用后保存。'}</p>${tab==='连接'?info()+`<button class="primary" onclick="tab='模型';render()">下一步：选择模型 →</button>`:tab==='模型'?modelTools()+modelList(true)+`<button class="primary" onclick="tab='测试';render()">下一步：测试连接 →</button>`:testView()}`;
if(v==='C')html=`<div class="hero"><div><h2>让对话准备好</h2><p class="muted">我的 AI 服务</p></div>${avatar}</div>${[1,2,3].map(n=>`<div class="fold"><button onclick="fold=fold===${n}?0:${n};render()"><span class="number">${n}</span><span class="desc"><strong>${['','连接服务','选择模型','试着连接'][n]}</strong><small>${['','api.example.com · 已填写密钥',models.length+' 个模型 · 思考已开启','发送问候，确认模型可用'][n]}</small></span><span>${fold===n?'−':'＋'}</span></button>${fold===n?`<div class="fold-content">${n===1?info():n===2?modelTools()+modelList():`<p class="muted">向已选模型发送一句问候，确认能收到完整回答。</p><button class="secondary" onclick="screen('test')">测试连接</button>`}</div>`:''}</div>`).join('')}<div class="note">可以先调整模型，再统一保存。</div>`;
}else if(page==='model'||page==='manual'){const manual=page==='manual';nav(manual?'手动添加模型':'模型设置','完成',manual?"models.push('自定义模型');screen('provider')":"screen('provider')");
const identity=field('显示名称 · 可选',manual?'':'DeepSeek Flash')+field('模型 ID',manual?'':'deepseek-flash');const toggles=`<div class="row"><span>思考模式<small>让模型在回答前多想一步</small></span><button class="toggle ${thinking?'':'off'}" onclick="thinking=!thinking;render()" aria-label="思考模式"></button></div>${thinking?`<div class="section-label">思考强度</div><div class="effort">${['Low','Medium','High'].map(e=>`<button class="${effort===e?'selected':''}" onclick="effort='${e}';render()">${e}</button>`).join('')}</div>`:''}<div class="row"><span>最大输出<small>${out?'自定义上限':'使用服务端默认值'}</small></span><button class="toggle ${out?'':'off'}" onclick="out=!out;render()" aria-label="自定义最大输出"></button></div>${out?field('最大输出 tokens','8192'):''}`;
html=v==='A'?`<div class="hero"><div><h2>${manual?'添加一个模型':'DeepSeek Flash'}</h2><p class="muted">按你的习惯，调整回答方式。</p></div></div>${identity}<div class="section-label">回答偏好</div>${toggles}`:v==='B'?`<div class="summary"><h2>${manual?'自定义模型':'DeepSeek Flash'}</h2><p class="muted">我的 AI 服务</p></div><div class="model-card">${identity}</div><div class="model-card"><h3>回答偏好</h3>${toggles}</div>`:`<h2 style="margin:12px 0 24px">${manual?'添加模型':'回答的方式'}</h2><details class="fold"><summary class="row">模型信息 <span class="muted">deepseek-flash</span></summary>${identity}</details>${toggles}`;
}else if(page==='test'){nav('测试连接','完成',"screen('provider')");html=testView()}
else if(page==='discover'){nav('获取模型','取消',"screen('provider')");html=`<h2 style="margin:12px 0">获取到 4 个模型</h2><p class="muted">选择用于对话的模型，添加后还可调整设置。</p><label class="field" style="margin-top:22px"><input placeholder="搜索模型" oninput="document.querySelectorAll('.check-row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))"></label>${['deepseek-flash','deepseek-v4-pro','demo-chat','demo-reasoner'].map((m,i)=>`<button class="check-row ${selected.has(m)?'checked':''}" onclick="selected.has('${m}')?selected.delete('${m}'):selected.add('${m}');render()"><span>${['DeepSeek Flash','DeepSeek V4 Pro','Demo Chat','Demo Reasoner'][i]}<small>${m}</small></span><span>${selected.has(m)?'✓':'○'}</span></button>`).join('')}`;$('#footer').innerHTML=`<div class="bottom-action"><button class="primary" ${selected.size?'':'disabled'} onclick="models=Array.from(new Set([...models,...Array.from(selected).map(m=>({'deepseek-flash':'DeepSeek Flash','deepseek-v4-pro':'DeepSeek V4 Pro','demo-chat':'Demo Chat','demo-reasoner':'Demo Reasoner'}[m]))]));screen('provider')">添加所选模型（${selected.size}）</button></div>`;
}else if(page==='chat'){nav('日记对话','',"void 0");html=`<div class="chat-hero"><div><h3>留一点空间，聊聊自己。</h3><p>从日记出发，也可以从此刻开始。</p></div>${avatar}</div><div class="section-label">最近对话</div>${!deleted?`<div class="chatrow"><div class="rowtop"><h3>关于最近的小小变化</h3><button onclick="if(confirm('删除这段对话？原日记会保留。')){deleted=true;render()}">删除</button></div><p>在忙碌里，也有一些值得留下来的瞬间。</p></div>`:''}<div class="chatrow"><h3>给今天留一点空间</h3><p>聊聊今天，也聊聊想成为的自己。</p></div><p class="muted" style="margin-top:20px">APP 中侧滑可删除；这里用删除按钮演示。</p>`;$('#footer').innerHTML=`<div class="bottom-action"><button class="primary" onclick="toast('演示：开始新对话')">＋ 开始新对话</button></div><div class="navtabs"><button>♩<br>记录</button><button>▤<br>日记</button><button>☏<br>对话</button></div>`}
$('#content').innerHTML=html}
function testView(){return `<div class="test">${avatar}<h2>${testState==='success'?'连接成功':testState==='failure'?'连接失败':testState==='running'?'正在连接…':'和模型打个招呼'}</h2><p class="muted">我的 AI 服务</p><div class="test-result"><label class="field"><span>测试模型</span><select><option>DeepSeek Flash</option><option>DeepSeek V4 Pro</option></select></label>${testState==='success'?'<p>✓ 已收到完整回答 · 1.2 秒</p>':testState==='failure'?'<p style="color:var(--red)">密钥验证失败（401），请检查 API Key。</p>':testState==='running'?'<p>正在等待完整回答…</p>':'<p class="muted">准备好后，发一句问候。</p>'}</div><p class="muted" style="text-align:left;margin-bottom:22px">仅发送一句问候，不包含日记或聊天内容。测试会产生少量模型调用费用。</p><button class="primary" onclick="testState='running';render();setTimeout(()=>{testState='success';render()},650)">${testState==='idle'?'开始测试':'重新测试'}</button><button class="bare" onclick="testState='failure';render()">原型演示：查看失败状态</button></div>`}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
