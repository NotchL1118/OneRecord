  <div class="workspace">
    <aside class="intro"><div class="eyebrow">A LITTLE ROOM FOR YOURSELF</div><h1>把今天，<br>聊明白。</h1><p>这份原型用于确认：服务商配置、模型参数，以及一段可以自由切换模型的日记对话，是否符合你的使用习惯。</p><nav id="scenes" class="scenes" aria-label="原型场景"></nav><div class="intro-note">所有日记、聊天与服务商均为演示数据。<br>不会调用真实 API，不会保存密钥。<br>刷新即可恢复，请勿输入真实密钥。</div></aside>
    <div class="phone"><div class="statusbar"><span>9:41</span><span class="island"></span><span class="status-icons"><svg viewBox="0 0 20 15"><path d="M1 13V10M6 13V7M11 13V4M16 13V1" stroke="currentColor" stroke-width="2.5"/></svg><svg viewBox="0 0 20 16"><path d="M2 5Q10-2 18 5M5 8Q10 3 15 8M8 11Q10 9 12 11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="14" r="1"/></svg><span class="battery"></span></span></div><main id="app"></main><div class="home-indicator"></div></div>
    <aside class="review" id="review"></aside>

<script>
// THROWAWAY PROTOTYPE. Standalone, synthetic fixtures, memory only. No API/storage calls.
const ICONS={back:'M15 18l-6-6 6-6',chevron:'M9 6l6 6-6 6',down:'M6 9l6 6 6-6',plus:'M12 5v14M5 12h14',chat:'M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z',book:'M4 3h13a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V3Zm0 13h15M8 7h7M8 10h6',sliders:'M4 7h16M4 17h16M8 4v6M16 14v6',check:'M5 12l4 4L19 6',send:'M12 19V5M6 11l6-6 6 6',stop:'M7 7h10v10H7Z',close:'M6 6l12 12M18 6 6 18',retry:'M4 9a8 8 0 1 1 0 6M4 4v5h5',trash:'M4 6h16M9 3h6M6 6l1 15h10l1-15M10 10v7M14 10v7',key:'M14 7a5 5 0 1 0-4 8l3 3h3v3h4v-4l-6-6',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',spark:'m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z',more:'M5 12h.01M12 12h.01M19 12h.01',edit:'m15 4 5 5M4 20l5-1L21 7l-4-4L5 15Z',alert:'M12 8v5M12 16h.01M10 3 2 19h20L14 3Z',clock:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',mic:'M9 4a3 3 0 0 1 6 0v8a3 3 0 0 1-6 0ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8',folder:'M3 6h7l2 3h9v11H3Z',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5ZM12 14v3',arrow:'M5 12h14M13 6l6 6-6 6'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]||ICONS.spark}"/></svg>`;
const dango=(size=36)=>`<svg class="dango" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><path d="M9 38C6 23 14 9 30 8c17-2 25 11 25 25 0 7 4 11-1 15-4 4-10 2-16 4-7 3-12 1-18-1C11 51 8 45 9 38Z" fill="#FFE39B"/><path d="M24 28v3m16-3v3m-11 6q4 4 8-1" fill="none" stroke="#796039" stroke-width="2.3" stroke-linecap="round"/><ellipse cx="19" cy="36" rx="4" ry="2" fill="#EDBF95"/><ellipse cx="45" cy="35" rx="4" ry="2" fill="#EDBF95"/></svg>`;
const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=value=>JSON.parse(JSON.stringify(value));
const uid=()=>Math.random().toString(36).slice(2,10);
const PROTOCOLS={chat:'OpenAI Chat Completions',responses:'OpenAI Responses',anthropic:'Anthropic Messages'};
const SCOPE_NAMES={all:'全部可用日记',today:'今天',week:'最近一周',custom:'自选日记'};
const SYS_PROMPT='你是一个帮助本人回顾日常的对话伙伴。根据本人提供的日记和聊天内容回应，区分事实与推测。引用只指向实际提供的日记，不编造经历。';
const model=(uid,id,name,protocol='chat')=>({uid,id,name,thinking:true,effort:'medium',maxMode:protocol==='anthropic'?'custom':'default',maxTokens:8192,inputMode:'none',inputBudget:32000,capacity:'未知'});
function seed(first=false){
 const providers=[{id:'deepseek',name:'DeepSeek',base:'https://api.deepseek.com',protocol:'chat',builtin:true,auth:'key',key:first?'':'DEMO_ONLY',headers:'',models:[model('flash','deepseek-flash','DeepSeek Flash'),model('pro','deepseek-v4-pro','DeepSeek V4 Pro')]},{id:'claude',name:'Claude 官方',base:'https://api.anthropic.com',protocol:'anthropic',builtin:false,auth:'key',key:'DEMO_ONLY',headers:'',models:[model('sonnet','claude-sonnet-4-6','Claude Sonnet 4.6','anthropic')]},{id:'local',name:'家里的本地模型',base:'http://192.168.1.20:11434/v1',protocol:'responses',builtin:false,auth:'none',key:'',headers:'',models:[model('localmodel','local-chat-model','本地聊天模型','responses')]}];
 const diaries=[{id:'d1',title:'散步时，终于慢了下来',date:'10 月 11 日',day:'today',body:'晚饭后没有立刻回消息，绕着小区走了二十分钟。风很舒服。好像不需要把每一分钟都安排满，心里也安静了一点。',participates:true,deleted:false},{id:'d2',title:'把事情写下来',date:'10 月 10 日',day:'week',body:'最近总觉得有很多事没做完。把脑子里的事写成清单后，发现真正需要今天处理的只有两件。完成一件小事，比一直想所有的事轻松。',participates:true,deleted:false},{id:'d3',title:'留一点时间给自己',date:'10 月 8 日',day:'week',body:'今天给自己留了半个小时，没有任务，只是喝茶、看窗外。希望这样的时间不必等到所有事做完才出现。',participates:true,deleted:false},{id:'d4',title:'一篇只留给自己的日记',date:'10 月 9 日',day:'week',body:'这篇演示日记已关闭参与 AI。',participates:false,deleted:false}];
 const ref=(id)=>{const d=diaries.find(x=>x.id===id);return {...d,snapshot:id+':v1'}};
 const source={pid:'deepseek',mid:'flash',provider:'DeepSeek',model:'DeepSeek Flash',modelID:'deepseek-flash',base:providers[0].base,protocol:'chat',thinking:true,effort:'medium'};
 const question='最近总觉得很忙，但又不知道自己到底在忙什么。你从我的日记里看到了什么？';
 const intro='我注意到，最近让你轻松一些的时刻，都不是“又完成了一件大事”。\n\n是晚饭后的二十分钟散步，也是把脑子里的事写成清单后，发现今天只需要处理两件。\n\n也许你需要的不是把自己安排得更满，而是给“已经足够了”留一点位置。\n\n如果今天只为自己留出十分钟，你想用它做什么？';
 const chat={id:'c1',title:'给最近的自己一点空间',selection:{p:'deepseek',m:'flash'},scope:'all',custom:['d1','d2'],messages:first?[]:[{id:'u1',role:'user',text:question},{id:'a1',role:'assistant',text:intro,status:'done',source,refs:[ref('d1'),ref('d2')],request:{question,refs:[ref('d1'),ref('d2')],history:[],selection:{p:'deepseek',m:'flash'},settings:clone(providers[0].models[0])}}]};
 return {providers:first?[providers[0]]:providers,diaries,chats:[chat],chatId:'c1',page:first?'list':'chat',scene:first?'first':'chat',selectionDefault:{p:'deepseek',m:'flash'},providerId:'deepseek',modelUid:'flash',modal:null,draft:null,input:'',lastChange:first?'首次使用：DeepSeek 已内置，等待填写密钥。':'正在预览一段使用演示日记的对话。',lastRequest:null,generating:null,systemPrompt:SYS_PROMPT,walk:0,first};
}
let S=seed(), streamTimer=null,toastTimer=null,lastRenderedPage=null;
const current=()=>S.chats.find(x=>x.id===S.chatId);
const provider=(id)=>S.providers.find(x=>x.id===id);
const selected=(selection)=>{const p=provider(selection?.p);return {p,m:p?.models.find(x=>x.uid===selection?.m)}};
const same=(a,b)=>!!a&&!!b&&a.p===b.p&&a.m===b.m;
const ready=(p)=>p&&p.models.length&&(p.auth!=='key'||!!p.key);
const activeSource=()=>{const {p,m}=selected(current()?.selection);return p&&m?{pid:p.id,mid:m.uid,provider:p.name,model:m.name,modelID:m.id,base:p.base,protocol:p.protocol,thinking:m.thinking,effort:m.effort}:null};
const findMessage=(id)=>current()?.messages.find(x=>x.id===id);
const lastUser=(c)=>c?.messages.filter(m=>m.role==='user').at(-1);
function stop(reason='stopped'){if(!S.generating)return;const c=S.chats.find(c=>c.id===S.generating.chat),m=c.messages.find(m=>m.id===S.generating.message);m.status=reason;S.generating=null;clearInterval(streamTimer);streamTimer=null;S.lastChange=reason==='failed'?'模拟网络中断：正文保留，错误提示不进入上下文。':'已停止：收到的正文保留，之后可以接着追问。';}
function freshRefs(c){const available=S.diaries.filter(d=>d.participates&&!d.deleted&&(c.scope==='all'||c.scope==='week'||(c.scope==='today'&&d.day==='today')||(c.scope==='custom'&&c.custom.includes(d.id))));return available.map(d=>({...clone(d),snapshot:d.id+':v1'}));}
function prepareRequest(c,question,retry){if(retry)return {...clone(retry.request),selection:clone(c.selection),source:activeSource(),settings:clone(selected(c.selection).m),retry:true};const history=c.messages.filter(m=>m.text?.trim()).map(m=>({role:m.role,text:m.text,status:m.status}));const allRefs=[...c.messages.flatMap(m=>m.refs||[]),...freshRefs(c)];const refs=[...new Map(allRefs.map(r=>[r.snapshot,r])).values()];return {question,history,refs,source:activeSource(),selection:clone(c.selection),settings:clone(selected(c.selection).m),retry:false,systemPrompt:S.systemPrompt};}
function begin(question,retryId){const c=current(),{p,m}=selected(c.selection);if(!p||!m){if(!retryId)S.input=question;S.modal={kind:'models'};render();return;}if(!ready(p)){if(!retryId)S.input=question;S.modal={kind:'needKey',pid:p.id};render();return;}if(S.generating)return;
 const old=retryId?findMessage(retryId):null;if(!old&&!question.trim())return;
 const req=prepareRequest(c,old?old.request.question:question.trim(),old);
 if(old){const pos=c.messages.indexOf(old);c.messages.splice(pos,1);}else{c.messages.push({id:uid(),role:'user',text:req.question});if(c.messages.length===1)c.title=req.question.slice(0,16);}
 const msg={id:uid(),role:'assistant',text:'',status:'streaming',source:clone(req.source),refs:clone(req.refs),request:clone(req)};c.messages.push(msg);S.lastRequest=req;S.input='';S.modal=null;S.generating={chat:c.id,message:msg.id};S.lastChange=old?'重试使用原问题与原材料，旧半截回答没有带入。':'请求已发出，使用发起时的模型与参数。';
 let reply=/继续|刚才|第二点|展开/.test(req.question)?'可以，我们就接着刚才聊。\n\n你已经找到一些让自己轻松的方法：把事情写下来，或在晚饭后走一小段路。它们不要求你先完成所有任务。\n\n不妨把今天的十分钟留给一件没有“完成指标”的小事。你现在更想安静待一会儿，还是出去走走？':req.refs.length?'从这些记录里，我看到你正在一点点找到自己的节奏。\n\n'+(req.refs.some(r=>r.id==='d1')?'比如散步时，你允许自己暂时不回消息，心里反而安静下来。':'比如把脑子里的事情写下来，让要做的事变得具体。')+'\n\n你不必马上解决所有事情。可以先问问自己：今天哪一件事真的需要我，哪一件事可以留给明天？\n\n如果愿意，我们可以一起把它们分开。':'可以，我们先从你现在的感受聊起。\n\n这次没有新取用的日记。你可以告诉我最近最占据心思的一件事，我们慢慢把它说清楚。';
 let cursor=0;render(true);streamTimer=setInterval(()=>{if(!S.generating){clearInterval(streamTimer);return;}cursor=Math.min(reply.length,cursor+3);msg.text=reply.slice(0,cursor);if(cursor===reply.length){msg.status='done';S.generating=null;clearInterval(streamTimer);streamTimer=null;S.lastChange='回答已完成，来源与本次引用已保留。';}render(true);},90);
}
function complete(){if(!S.generating)return;const msg=findMessage(S.generating.message);msg.text+='\n\n给自己留一点余地，也是一种认真生活的方式。我们可以从最小的一步开始。';msg.status='done';S.generating=null;clearInterval(streamTimer);streamTimer=null;S.lastChange='已快进演示：回答完成。';render(true);}
function nav(page){if(page==='chat'&&!current())return newChat();if(S.page==='chat'&&page!=='chat')stop();S.page=page;S.modal=null;render();}
function reset(first=false){clearInterval(streamTimer);S=seed(first);lastRenderedPage=null;render();}
function newChat(){stop();const c={id:uid(),title:'新的日记对话',selection:clone(S.selectionDefault),scope:'all',custom:['d1'],messages:[]};S.chats.unshift(c);S.chatId=c.id;S.input='';S.page='chat';S.modal=null;S.lastChange='新对话使用默认模型，范围为全部可用日记。';render();}
function chooseModel(p,m,confirmed=false){const c=current();if(S.generating){S.modal={kind:'stopSwitch',p,m};render();return;}if(c.selection&&c.selection.p!==p&&c.messages.some(m=>m.text)&&!confirmed){S.modal={kind:'crossProvider',p,m};render();return;}c.selection={p,m};S.modal=null;S.lastChange='已切换模型；已有回答的来源保持不变。';render();}
function openProvider(id){if(S.page==='chat'){stop();S.editFromChat=true;}S.providerId=id;S.draft=id?clone(provider(id)):{id:uid(),name:'',base:'',protocol:'chat',builtin:false,auth:'key',key:'',headers:'',models:[]};S.page='provider';S.modal=null;render();}
function openModel(p,m){if(S.page==='chat'){stop();S.editFromChat=true;}S.providerId=p;S.modelUid=m;const pp=provider(p);S.draft=m?clone(pp.models.find(x=>x.uid===m)):model(uid(),'','',pp.protocol);S.page='model';S.modal=null;render();}
function field(key,value,redraw=false){if(key==='input'){S.input=value;return;}if(key==='prompt'){S.systemPrompt=value;return;}S.draft[key]=value;if(key==='protocol'&&value==='anthropic')S.draft.models.forEach(m=>{if(m.maxMode==='default'){m.maxMode='custom';m.maxTokens=8192;}});if(redraw)render();}
function toast(text){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.getElementById('app').append(t);toastTimer=setTimeout(()=>t.remove(),2700);}
function saveProvider(confirmAddress=false){const d=S.draft;if(!d.name.trim()||!/^https?:\/\/[^\s]+$/.test(d.base)){toast('请填写名称和有效的 HTTP / HTTPS 地址');return;}const old=provider(d.id);if(old&&old.base!==d.base&&old.key&&!confirmAddress){S.modal={kind:'addressChange'};render();return;}if(confirmAddress)d.key='';if(old)S.providers[S.providers.indexOf(old)]=clone(d);else S.providers.push(clone(d));S.providerId=d.id;S.page=S.editFromChat?'chat':'providers';S.editFromChat=false;S.modal=null;S.lastChange='服务商配置已保存；历史回答来源不变。';render();toast('已保存 · 演示数据仅保留在当前页面');}
function saveModel(){const p=provider(S.providerId),d=S.draft;if(!d.id.trim()){toast('请填写模型 ID');return;}if(!d.name.trim())d.name=d.id;if(d.maxMode==='custom'&&(!Number.isInteger(Number(d.maxTokens))||Number(d.maxTokens)<1)){toast('输出上限需要填写正整数');return;}if(d.inputMode==='custom'&&Number(d.inputBudget)<1){toast('输入预算需要填写正数');return;}if(p.models.some(x=>x.uid!==d.uid&&x.id===d.id)){toast('这份服务商配置里已存在相同模型 ID');return;}const old=p.models.find(x=>x.uid===d.uid);if(old)p.models[p.models.indexOf(old)]=clone(d);else p.models.push(clone(d));S.lastChange='模型参数已保存，只影响之后发出的请求。';if(S.editFromChat){S.editFromChat=false;S.page='chat';S.modal=null;render();}else openProvider(p.id);toast('模型已保存');}
function remove(kind,id,pid){if(kind==='provider'){S.providers=S.providers.filter(p=>p.id!==id);if(S.selectionDefault?.p===id)S.selectionDefault=null;S.chats.forEach(c=>{if(c.selection?.p===id)c.selection=null;});S.page='providers';}else{const p=provider(pid);p.models=p.models.filter(m=>m.uid!==id);if(same(S.selectionDefault,{p:pid,m:id}))S.selectionDefault=null;S.chats.forEach(c=>{if(same(c.selection,{p:pid,m:id}))c.selection=null;});S.providerId=pid;S.draft=clone(p);S.page='provider';}S.modal=null;S.lastChange='配置已删除，历史聊天与回答来源仍保留；需要重新选择模型。';render();}
const logo=p=>`<span class="logo ${p?.id==='local'?'local':p?.protocol==='anthropic'?'claude':''}">${p?.builtin?'≈':p?.id==='local'?icon('folder'):p?.protocol==='anthropic'?'✳':icon('spark')}</span>`;
const btn=(label,act,cls='primary',attrs='')=>`<button class="${cls}" data-act="${act}" ${attrs}>${label}</button>`;
function header(title,back='list',right=''){return `<header class="nav"><button class="icon-btn side" data-act="nav" data-page="${back}" aria-label="返回">${icon('back')}</button><div class="nav-center"><h2>${esc(title)}</h2></div>${right||'<span class="side"></span>'}</header>`;}
function bottomTabs(active='chat'){return `<nav class="bottom-tabs">${[['record','mic','记录'],['diary','book','日记'],['list','chat','对话']].map(([p,i,n])=>`<button class="${p===(active==='chat'?'list':active)?'active':''}" data-act="nav" data-page="${p}">${icon(i)}<span>${n}</span></button>`).join('')}</nav>`;}
function listView(){return `<header class="nav root"><h2>日记对话</h2><button class="icon-btn" data-act="nav" data-page="more" aria-label="更多">${dango(40)}</button></header><div class="scroll page-pad"><div class="hero-card"><div class="grow"><h3>留一点空间，聊聊自己。</h3><p>从日记出发，也可以从此刻开始。</p></div>${dango(60)}</div>${btn(icon('plus')+' 开始新对话','new-chat','primary full')}<div class="group-label">最近对话</div>${S.chats.filter(c=>c.messages.length).length?S.chats.filter(c=>c.messages.length).map(c=>`<button class="history-item" data-act="open-chat" data-id="${c.id}"><div class="grow"><strong>${esc(c.title)}</strong><p>${esc(c.messages.filter(m=>m.role==='assistant').at(-1)?.text||'还没有回复')}</p></div><time>今天</time></button>`).join(''):`<div class="empty-state">${icon('chat')}<p>还没有日记对话。<br>想聊的时候，随时开始。</p></div>`}<p class="tagline">聊天与日记分别保存，AI 回答不会写回日记。</p></div>${bottomTabs()}`;}
function modelChangeNotice(c,index){const previous=c.messages.slice(0,index).filter(m=>m.role==='assistant'&&m.source).at(-1);const reply=c.messages[index+1];if(!previous||reply?.role!=='assistant'||!reply.source)return '';const a=previous.source,b=reply.source;if(a.pid===b.pid&&a.modelID===b.modelID)return '';return `<div class="model-change"><span>已切换为 ${esc(b.model)} · ${esc(b.provider)}</span></div>`;}
function chatView(){const c=current(),{p,m}=selected(c.selection),last=lastUser(c);return `<header class="nav"><button class="icon-btn side" data-act="nav" data-page="list" aria-label="返回对话列表">${icon('back')}</button><div class="nav-center"><h2>${esc(c.messages.length?c.title:'新的日记对话')}</h2></div><button class="icon-btn side" data-act="chat-menu" aria-label="对话选项">${icon('more')}</button></header><div class="chat-controls"><button class="chip" data-act="scope">${icon('book')}<span>${SCOPE_NAMES[c.scope]}</span>${icon('down')}</button><button class="chip model" data-act="models"><span>${esc(m?.name||'选择模型')}</span>${icon('down')}</button></div><div class="scroll" id="chat-scroll">${c.messages.length?`<div class="chat-log"><div class="day-divider">今天 · 10 月 11 日</div>${c.messages.map((msg,index)=>{if(msg.role==='user')return `${modelChangeNotice(c,index)}<div class="message user">${esc(msg.text)}</div>`;const canRetry=last&&c.messages.indexOf(msg)>c.messages.indexOf(last)&&msg.status!=='streaming'&&!S.generating;return `<article class="message assistant"><div class="assistant-label">${dango(25)}<span>OneRecord</span>${msg.status==='stopped'?'<span class="badge gray">已停止</span>':msg.status==='failed'?'<span class="badge gray">生成失败</span>':msg.status==='streaming'?'<span class="badge">正在回复</span>':''}</div><div class="message-text">${esc(msg.text)||(msg.status==='streaming'?'<span style="font-size:12px;color:#AA9981">正在整理思绪…</span>':'<span style="font-size:12px;color:#AA9981">尚未收到回答正文。</span>')}</div>${msg.status==='failed'?`<div class="message-error">${icon('alert')}连接中断，已收到的内容已保留</div>`:''}${msg.text&&msg.refs?.length?`<div class="references"><button class="references-toggle" data-act="toggle-refs" data-id="${msg.id}" aria-expanded="${!!msg.refsExpanded}" aria-controls="refs-${msg.id}">${icon('book')}<span>引用 ${msg.refs.length} 篇日记</span><span class="chevron">${icon('down')}</span></button>${msg.refsExpanded?`<div class="reference-list" id="refs-${msg.id}">${msg.refs.map((r,i)=>`<button class="reference-item" data-act="ref" data-msg="${msg.id}" data-index="${i}"><span class="grow"><strong>${esc(r.title)}</strong><time>${esc(r.date)}</time></span>${icon('chevron')}</button>`).join('')}</div>`:''}</div>`:''}<div class="source-line"><button data-act="source" data-id="${msg.id}">${esc(msg.source.provider)} · ${esc(msg.source.model)} ${icon('down')}</button>${canRetry?btn(icon('retry'),'retry','retry-icon',`data-id="${msg.id}" aria-label="重新回答" title="重新回答"`):''}</div></article>`;}).join('')}</div>`:`<div class="empty-chat">${dango(76)}<h3>今天，想聊些什么？</h3><p>可以一起回顾日记，<br>也可以只说说此刻的想法。</p><div style="height:21px"></div>${['从最近的日记里，你看到了什么？','我想聊聊今天的心情','帮我回顾最近轻松的时刻'].map(q=>btn(esc(q),'suggestion','suggestion',`data-text="${esc(q)}"`)).join('')}${!ready(p)?'<p style="margin-top:23px">先配置一个模型，就可以开始对话。</p>':''}</div>`}</div><div class="compose"><div class="compose-box"><textarea id="composer" placeholder="说说你现在的想法…" aria-label="聊天输入" oninput="field('input',this.value)">${esc(S.input)}</textarea><button class="send-button" data-act="${S.generating?'stop':'send'}" aria-label="${S.generating?'停止生成':'发送消息'}">${icon(S.generating?'stop':'send')}</button></div><div class="compose-note"><span>${m?.thinking?'思考已开启 · '+esc(m.effort[0].toUpperCase()+m.effort.slice(1)):'思考已关闭'}</span><button data-act="current-model" style="padding:0;font-size:9px">模型参数</button></div></div>`;}
function providersView(){const def=selected(S.selectionDefault);return `${header('AI 服务商与模型','more')}<div class="scroll page-pad"><div class="group-label">新对话的默认模型</div><div class="card"><button class="row" data-act="default-model">${icon('spark')}<span class="grow"><strong>${esc(def.m?.name||'尚未选择默认模型')}</strong><small>${def.p?esc(def.p.name):'请选择一个模型，不会自动切换服务商'}</small></span>${icon('chevron')}</button></div><div class="group-label">服务商</div><div class="card">${S.providers.map(p=>`<button class="row" data-act="provider" data-id="${p.id}">${logo(p)}<span class="grow"><strong>${esc(p.name)} ${p.builtin?'<span class="badge">内置</span>':''}</strong><small>${p.models.length} 个模型 · ${ready(p)?(p.auth==='none'?'无需认证':'已配置密钥'):'待填写密钥'}</small></span>${icon('chevron')}</button>`).join('')}</div>${btn(icon('plus')+' 添加自定义服务商','add-provider','text-button')}<p class="tagline">同一服务商配置可添加多个模型。DeepSeek 为内置服务商，不可删除。</p><div class="group-label">对话偏好</div><div class="card"><button class="row" data-act="nav" data-page="prefs"><span class="grow"><strong>对话指引</strong><small>查看与编辑系统提示词</small></span>${icon('chevron')}</button></div></div>`;}
function providerView(){const d=S.draft;return `${header(d.builtin?'DeepSeek':S.providerId?'编辑服务商':'添加服务商','providers',btn('保存','save-provider','right-button'))}<div class="scroll page-pad"><div style="display:flex;align-items:center;gap:12px;padding:4px 3px 14px">${logo(d)}<div><strong style="font-size:17px">${esc(d.name||'自定义服务商')}</strong><div class="micro">${d.builtin?'内置 · 官方地址与模型由应用维护':'支持自定义地址、模型和认证'}</div></div></div><div class="card"><div class="field"><label for="provider-name">显示名称</label><input id="provider-name" value="${esc(d.name)}" placeholder="例如：我的模型服务" ${d.builtin?'readonly':''} oninput="field('name',this.value)"></div><div class="field"><label for="provider-protocol">API 格式</label><select id="provider-protocol" ${d.builtin?'disabled':''} onchange="field('protocol',this.value,true)">${Object.entries(PROTOCOLS).map(([id,n])=>`<option value="${id}" ${d.protocol===id?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="provider-base">Base URL</label><input id="provider-base" value="${esc(d.base)}" placeholder="https://example.com/v1" ${d.builtin?'readonly':''} oninput="field('base',this.value)"><small>${d.builtin?'https://api.deepseek.com':'支持 HTTP、HTTPS、端口和代理路径'}</small></div></div><div class="group-label">认证</div><div class="card">${!d.builtin?`<div class="field"><label for="auth-mode">认证方式</label><select id="auth-mode" onchange="field('auth',this.value,true)"><option value="key" ${d.auth==='key'?'selected':''}>API Key</option><option value="none" ${d.auth==='none'?'selected':''}>无需认证</option><option value="headers" ${d.auth==='headers'?'selected':''}>自定义请求头</option></select></div>`:''}${d.auth==='key'?`<div class="field"><label for="provider-key">API Key</label><input id="provider-key" type="password" autocomplete="off" value="${esc(d.key)}" placeholder="此处仅演示，请勿填写真实密钥" oninput="field('key',this.value)"><small>正式 App 会将密钥保存在本机钥匙串。</small></div>`:''}${!d.builtin?`<div class="field"><label for="provider-headers">自定义请求头 · 选填</label><textarea id="provider-headers" placeholder="X-Example-Header: demo-value" style="min-height:48px" oninput="field('headers',this.value)">${esc(d.headers)}</textarea></div>`:''}</div>${d.auth==='key'?btn('填入演示密钥','demo-key','text-button'):''}<div class="group-label">模型 ${d.builtin?'<span class="badge gray">预置</span>':''}</div><div class="card">${d.models.length?d.models.map(m=>`<button class="row" data-act="edit-model" data-p="${d.id}" data-m="${m.uid}"><span class="grow"><strong>${esc(m.name)} ${same(S.selectionDefault,{p:d.id,m:m.uid})?'<span class="default-star">★</span>':''}</strong><small>${esc(m.id)}</small></span>${icon('chevron')}</button>`).join(''):'<div class="row"><small>保存服务商后，即可添加模型。</small></div>'}</div>${!d.builtin?btn(icon('plus')+' 添加模型','add-model','text-button'):''}<div class="form-buttons">${btn(icon('link')+' 测试连接','test','secondary')}${btn('保存配置','save-provider','primary')}</div>${!d.builtin&&S.providerId?btn(icon('trash')+' 删除服务商','delete-provider','text-button danger',`data-id="${d.id}"`):''}<p class="tagline">测试连接需要选择一个模型。本原型只模拟结果，不发送网络请求。</p></div>`;}
function modelView(){const d=S.draft,p=provider(S.providerId),anthropic=p.protocol==='anthropic';return `${header(d.name||'添加模型','provider-return',btn('保存','save-model','right-button'))}<div class="scroll page-pad"><div class="group-label">${esc(p.name)} · 模型信息</div><div class="card"><div class="field"><label for="model-name">显示名称</label><input id="model-name" value="${esc(d.name)}" placeholder="选填，默认使用模型 ID" ${p.builtin?'readonly':''} oninput="field('name',this.value)"></div><div class="field"><label for="model-id">模型 ID</label><input id="model-id" value="${esc(d.id)}" placeholder="服务商要求的模型名称" ${p.builtin?'readonly':''} oninput="field('id',this.value)"></div></div><div class="group-label">思考</div><div class="card"><div class="setting-row"><div class="grow"><strong>思考模式</strong><small>默认开启，回答前进行推理</small></div><button class="switch ${d.thinking?'on':''}" role="switch" aria-checked="${d.thinking}" aria-label="思考模式" data-act="toggle-thinking"></button></div><div class="field ${!d.thinking?'disabled-group':''}"><label>思考强度</label><div class="segmented">${['low','medium','high',...(p.builtin?['max']:[])].map(e=>btn(e[0].toUpperCase()+e.slice(1),'effort',d.effort===e?'selected':'',`data-value="${e}"`)).join('')}</div>${p.builtin&&d.thinking?`<small>${d.effort==='medium'?'Medium 为兼容档位，DeepSeek 实际使用 High。':'将请求 DeepSeek 的 '+esc(d.effort)+' 档位。'}</small>`:p.id==='local'?'<small>自定义模型的支持情况需通过实际服务验证。</small>':'<small>设置会随请求发送；思考过程不在聊天中单独展开。</small>'}</div></div><div class="group-label">输出与上下文</div><div class="card"><div class="field"><label for="max-mode">最大输出</label><select id="max-mode" onchange="field('maxMode',this.value,true)">${!anthropic?`<option value="default" ${d.maxMode==='default'?'selected':''}>服务端默认 · 不额外限制</option>`:''}<option value="custom" ${d.maxMode==='custom'?'selected':''}>自定义上限</option></select>${d.maxMode==='custom'?`<input aria-label="最大输出 token 数" type="number" min="1" value="${d.maxTokens}" oninput="field('maxTokens',Number(this.value))">`:''}<small>${anthropic?'此格式必须提供上限，建议值 8,192 tokens，可修改。':'服务端仍有自己的输出上限。'}${d.maxMode==='custom'?' 上限可能同时包含思考与正文。':''}</small></div><div class="field"><label for="input-mode">应用额外的输入预算</label><select id="input-mode" onchange="field('inputMode',this.value,true)"><option value="none" ${d.inputMode==='none'?'selected':''}>不额外限制</option><option value="custom" ${d.inputMode==='custom'?'selected':''}>设置 token 预算</option></select>${d.inputMode==='custom'?`<input aria-label="输入 token 预算" type="number" min="1" value="${d.inputBudget}" oninput="field('inputBudget',Number(this.value))">`:''}<small>模型容量：${esc(d.capacity)}。未知时不预设隐藏上限。</small></div></div><div class="form-buttons">${btn('设为默认模型','set-default','secondary',S.modelUid?'':'disabled')}${btn('保存参数','save-model','primary')}</div>${!p.builtin&&S.modelUid?btn(icon('trash')+' 删除模型','delete-model','text-button danger',`data-id="${d.uid}" data-p="${p.id}"`):''}</div>`;}
function moreView(){return `${header('更多','list')}<div class="scroll page-pad"><div style="display:flex;align-items:center;gap:14px;padding:16px 8px 26px">${dango(66)}<div><h3 style="font-size:20px">OneRecord</h3><p class="micro">留一点今天。</p></div></div><div class="card"><button class="row" data-act="nav" data-page="providers"><span class="grow"><strong>AI 服务商与模型</strong><small>管理服务商、模型与默认设置</small></span>${icon('chevron')}</button><button class="row" data-act="nav" data-page="prefs"><span class="grow"><strong>对话偏好</strong><small>查看与编辑系统提示词</small></span>${icon('chevron')}</button><div class="row"><span class="grow"><strong>外观与配色</strong></span><span class="badge">香草布丁</span></div></div></div>`;}
function prefsView(){return `${header('对话指引','providers')}<div class="scroll page-pad"><div class="group-label">对话指引</div><div class="card"><div class="field"><label for="system-prompt">发送给模型的系统提示词</label><textarea id="system-prompt" style="min-height:210px" oninput="field('prompt',this.value)">${esc(S.systemPrompt)}</textarea><small>你可以在这里调整回答的语气与方式。</small></div></div>${btn('恢复默认指引','reset-prompt','text-button')}<div style="height:20px"></div>${btn('完成','prefs-done','primary full')}</div>`;}
function openDiary(id){const d=S.diaries.find(d=>d.id===id&&!d.deleted);if(!d)return toast('原日记已删除');S.diaryReturnPage=S.page;S.diaryReturnScroll=document.querySelector('#app .scroll')?.scrollTop||0;S.diaryId=id;nav('diaryDetail');}
function returnFromDiary(){nav(S.diaryReturnPage||'diary');const sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=S.diaryReturnScroll||0;}
function diaryDetailView(){const d=S.diaries.find(d=>d.id===S.diaryId);return `${header('日记详情','diary-return')}<div class="scroll diary-detail"><div class="diary-date">${esc(d.date)} · 日记</div><h1>${esc(d.title)}</h1><div class="diary-body">${esc(d.body)}</div>${!d.participates?'<span class="badge gray">不参与 AI</span>':''}</div>`;}
function diaryView(){return `<header class="nav root"><h2>日记</h2><button class="icon-btn" data-act="nav" data-page="more" aria-label="更多">${dango(40)}</button></header><div class="scroll page-pad">${S.diaries.filter(d=>!d.deleted).map(d=>`<button class="history-item" data-act="diary" data-id="${d.id}"><div><div class="diary-date">${esc(d.date)}</div><strong>${esc(d.title)}</strong><p>${esc(d.body)}</p>${!d.participates?'<span class="badge gray" style="margin-top:9px">不参与 AI</span>':''}</div></button>`).join('')}</div>${bottomTabs('diary')}`;}
function recordView(){return `<header class="nav root"><h2>OneRecord</h2><button class="icon-btn" data-act="nav" data-page="more" aria-label="更多">${dango(40)}</button></header><div class="scroll page-pad"><div class="empty-chat" style="padding-top:75px">${dango(150)}<h3>留一点今天。</h3><p>这一轮先预览日记对话。<br>你的记录，依然好好地留在这里。</p><div style="height:30px"></div>${btn(icon('chat')+' 去聊聊','nav','primary full','data-page="list"')}</div></div>${bottomTabs('record')}`;}
function modalView(){const o=S.modal;if(!o)return '';let title='',body='';
 if(o.kind==='models'||o.kind==='defaults'){title=o.kind==='defaults'?'新对话的默认模型':'选择模型';body='<p>'+ (o.kind==='defaults'?'只影响之后新建的聊天。':'已有回答保留原来的来源。')+'</p>'+S.providers.map(p=>`<div class="group-label">${esc(p.name)} ${p.builtin?'<span class="badge">内置</span>':''}</div>${p.models.map(m=>`<button class="choice ${same(o.kind==='defaults'?S.selectionDefault:current()?.selection,{p:p.id,m:m.uid})?'selected':''}" data-act="${o.kind==='defaults'?'pick-default':'pick-model'}" data-p="${p.id}" data-m="${m.uid}"><span class="check">${same(o.kind==='defaults'?S.selectionDefault:current()?.selection,{p:p.id,m:m.uid})?icon('check'):''}</span><span class="grow"><strong>${esc(m.name)}</strong><small>${ready(p)?esc(m.id):'待填写密钥'}</small></span>${same(S.selectionDefault,{p:p.id,m:m.uid})?'<span class="badge">默认</span>':''}</button>`).join('')}`).join('')+btn(icon('plus')+' 管理服务商与模型','nav','text-button','data-page="providers"');}
 if(o.kind==='scope'){title='这次，想回顾哪些日记？';const c=current();body='<p>范围只影响之后新取用的材料。此前引用过的内容仍保留在聊天里。</p>'+Object.entries(SCOPE_NAMES).map(([id,name])=>`<button class="choice ${c.scope===id?'selected':''}" data-act="pick-scope" data-id="${id}"><span class="check">${c.scope===id?icon('check'):''}</span><span class="grow"><strong>${name}</strong>${id==='all'?'<small>仅包含开启「参与 AI」的日记</small>':''}</span></button>`).join('')+(c.scope==='custom'?`<div class="group-label">选择日记</div>${S.diaries.filter(d=>!d.deleted).map(d=>`<button class="choice ${c.custom.includes(d.id)&&d.participates?'selected':''}" data-act="toggle-diary" data-id="${d.id}" ${d.participates?'':'disabled'}><span class="check">${c.custom.includes(d.id)&&d.participates?icon('check'):''}</span><span class="grow"><strong>${esc(d.title)}</strong><small>${d.participates?d.date:'已关闭「参与 AI」'}</small></span></button>`).join('')}`:'')+btn('完成','close-modal','primary full');}
 if(o.kind==='crossProvider'){title='切换到 '+provider(o.p).name;body=`<p>之后的请求会把这段聊天和已有日记引用发送给 <strong>${esc(provider(o.p).name)}</strong>。</p><div class="note">已有回答仍显示原来的服务商和模型。</div>${btn('切换并继续聊天','confirm-switch','primary full')}${btn('暂不切换','close-modal','secondary full')}`;}
 if(o.kind==='stopSwitch'){title='先停止当前回答';body=`<p>这条回答还在生成。停止后，已收到的文字会保留，再选择下一次使用的模型。</p>${btn('停止并选择模型','stop-then-model','primary full')}${btn('继续等待','close-modal','secondary full')}`;}
 if(o.kind==='needKey'){title='先配置 '+provider(o.pid).name;body=`<p>已经准备好官方地址和模型，填入你的 API Key 后就能开始。</p>${btn('去填写密钥','provider','primary full',`data-id="${o.pid}"`)}${btn('选择其他模型','models','secondary full')}`;}
 if(o.kind==='chatMenu'){title='这段对话';body=btn(icon('sliders')+' 模型参数','current-model','secondary full')+btn(icon('book')+' 取用日记范围','scope','secondary full')+btn(icon('trash')+' 删除这段聊天','delete-chat-confirm','secondary full danger');}
 if(o.kind==='deleteChat'){title='删除这段聊天？';body=`<p>聊天内容及引用会一起删除，日记本身不受影响。</p>${btn('删除聊天','delete-chat','primary full danger')}${btn('取消','close-modal','secondary full')}`;}
 if(o.kind==='ref'){const msg=findMessage(o.msg),r=msg.refs[o.index],original=S.diaries.find(d=>d.id===r.id);title=r.title;body=`<div class="source-paper"><time>${esc(r.date)}</time><p style="font-size:13px;color:var(--ink)">${esc(r.body)}</p></div>${!original||original.deleted?'<div class="note">原日记已删除</div>':btn('查看原日记','diary','secondary full',`data-id="${r.id}"`)}${btn('返回聊天','close-modal','primary full')}`;}
 if(o.kind==='source'){const msg=findMessage(o.id),s=msg.source;title='这条回答的来源';body=`<div class="card">${[['服务商',s.provider],['模型',s.model],['模型 ID',s.modelID],['地址',s.base],['API 格式',PROTOCOLS[s.protocol]],['思考',s.thinking?'开启 · '+s.effort:'关闭']].map(([k,v])=>`<div class="field"><label>${k}</label><div style="font-size:12px;overflow-wrap:anywhere">${esc(v)}</div></div>`).join('')}</div><p class="tagline">记录的是回答产生时的设置。后续修改或删除服务商不会改写这份来源。</p>${btn('知道了','close-modal','primary full')}`;}
 if(o.kind==='deleteProvider'||o.kind==='deleteModel'){const isP=o.kind==='deleteProvider';title=isP?'删除服务商？':'删除模型？';body=`<p>已有聊天和回答来源会保留。使用它的聊天需要另选模型后才能继续发送，默认模型也不会自动换成其他服务。</p>${btn('确认删除','confirm-delete','primary full danger',`data-kind="${isP?'provider':'model'}" data-id="${o.id}" data-p="${o.p||''}"`)}${btn('取消','close-modal','secondary full')}`;}
 if(o.kind==='addressChange'){title='服务地址发生了变化';body=`<p>旧密钥不会自动带到新地址。保存后请为新地址重新填写密钥。</p>${btn('保存新地址并清除旧密钥','confirm-address','primary full')}${btn('返回检查','close-modal','secondary full')}`;}
 if(o.kind==='test'){title='测试连接';const d=S.draft;body=`<p>选择一个模型，发送“你好，请回复收到”。不会使用日记或聊天内容；正式使用时可能产生少量 API 费用。</p><div class="card"><div class="field"><label for="test-model">模型</label><select id="test-model">${d.models.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></div></div>${o.result?`<div class="test-status">${o.result==='ok'?'演示结果：连接成功，模型回复「收到」。':'演示结果：缺少密钥。你仍然可以保存配置。'}</div>`:''}<div class="note">原型只模拟测试结果，不会实际请求服务商。</div>${btn(o.result?'再次模拟测试':'模拟发送测试','run-test','primary full',d.models.length?'':'disabled')}`;}
 return `<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-handle"></div><div class="sheet-heading"><h3>${esc(title)}</h3><button class="icon-btn" data-act="close-modal" aria-label="关闭">${icon('close')}</button></div>${body}</section></div>`;
}
const SCENES=[['chat','日记对话'],['providers','服务商与模型'],['params','模型参数'],['switch','切换模型后的对话'],['first','第一次使用'],['edge','停止与重试']];
function scene(id){clearInterval(streamTimer);S=seed(id==='first');lastRenderedPage=null;S.scene=id;if(id==='providers')S.page='providers';if(id==='params')openModel('deepseek','flash');if(id==='switch'){const c=current();c.selection={p:'claude',m:'sonnet'};const question='换个角度看，我可以从哪里开始？';const req=prepareRequest(c,question);c.messages.push({id:'u2',role:'user',text:question},{id:'a2',role:'assistant',text:'可以从今晚的十分钟开始。把手机放在一边，去走一小段路，或者只是坐下来喝杯茶。\n\n先给自己一点空白，再决定下一步。',status:'done',source:clone(req.source),refs:clone(req.refs),request:clone(req)});S.lastChange='第二轮已使用 Claude；切换提示位于这轮消息前，上一条回答仍保留 DeepSeek 的来源。';}if(id==='edge'){S.page='chat';S.walk=0;S.lastChange='按右侧步骤体验：停止、追问、失败与重试。';}render(id==='switch');}
function reviewView(){const c=current(),{p,m}=selected(c?.selection),def=selected(S.selectionDefault),req=S.lastRequest,partial=c?.messages.filter(m=>m.role==='assistant'&&m.text&&['stopped','failed'].includes(m.status)).length||0;let steps=['发起一轮回答','停止这条回答','追问刚才的内容','模拟网络中断','重试最后一个问题'];const walkTitle=steps[S.walk]||'这组流程已体验完成';return `<div><div class="review-title"><span class="live-dot"></span>方案检查 · 实时状态</div><h3>${S.page==='model'?'每个模型，自己的参数':S.page==='provider'?'一个服务商，多个模型':'你现在看到的状态'}</h3><div class="state-panel">${[['当前模型',m?`${p.name}<br>${m.name}`:'尚未选择'],['新对话默认',def.m?def.m.name:'未选择 · 不自动替换'],['生成状态',S.generating?'正在生成':partial?`保留 ${partial} 条未完成回答`:'空闲'],['日记范围',SCOPE_NAMES[c?.scope]||'全部可用日记'],['思考设置',m?.thinking?`开启 · ${m.effort}<br><em>${p?.builtin&&m.effort==='medium'?'DeepSeek 实际 High':''}</em>`:'关闭'],['下一轮历史',`${c?.messages.filter(m=>m.text?.trim()).length||0} 条有正文消息`]].map(([k,v])=>`<div class="state-pair"><span>${k}</span><b>${v}</b></div>`).join('')}${req?`<div class="state-pair"><span>最近一次请求</span><b>${req.retry?'重试 · 原问题与原材料':'新问题'}<br>${req.history.length} 条历史 / ${req.refs.length} 份引用</b></div>`:''}</div><p>${esc(S.lastChange)}</p><div class="review-controls">${btn(icon('alert')+' 模拟本次断网','fail','',S.generating?'':'disabled')}${btn(icon('arrow')+' 快进至回答完成','complete','',S.generating?'':'disabled')}${btn(icon('trash')+' 删除一篇引用源日记','remove-source','')}${btn(icon('retry')+' 重置演示','reset','')}</div></div><div class="walkthrough"><div class="kicker">${S.scene==='edge'?'GUIDED WALKTHROUGH':'TRY IT YOURSELF'}</div><h4>${S.scene==='edge'?`${Math.min(S.walk+1,5)} / 5 · ${walkTitle}`:S.scene==='first'?'第一次开始日记对话':S.scene==='params'?'参数都可以看见':S.scene==='providers'?'试着添加自己的服务':'试着换一种视角'}</h4><p>${S.scene==='edge'?'每一步都会改变手机内的真实演示状态。留意右侧记录与回答下方的来源。':S.scene==='first'?'新建对话 → 发送一句话 → 填入演示密钥 → 返回聊天。无需额外向导。':S.scene==='params'?'试试关闭思考、改变强度、填写输出上限，再保存。DeepSeek 的 Medium 映射会明确显示。':S.scene==='providers'?'支持三个 API 格式。也可以填本地 HTTP 地址，并选择「无需认证」。':'点击聊天顶部模型，换到 Claude 或本地模型。已有回答的来源不会变化。'}</p>${S.scene==='edge'?btn(S.walk<5?'执行这一步':'重新体验','walk','',S.walk===1||S.walk===3?(S.generating?'':'disabled'):''):btn(S.scene==='first'?'开始配置':S.scene==='providers'?'添加服务商':S.scene==='params'?'返回聊天试试':'打开模型选择',S.scene==='first'?'new-chat':S.scene==='providers'?'add-provider':S.scene==='params'?'return-chat':'models','')}</div><div style="margin-top:18px"><p><strong style="font-weight:600">本轮一起确认</strong><br>Anthropic 输出上限预填 8,192；其他格式采用服务端默认。引用默认折叠；切换模型并发送后，对话中会出现一条轻提示。</p></div>`;}
function render(scrollBottom=false){const oldScroll=lastRenderedPage===S.page?(document.querySelector('#app .scroll')?.scrollTop||0):0;const sheetScroll=document.querySelector('.sheet')?.scrollTop||0;lastRenderedPage=S.page;const focused=document.activeElement?.id;const selectionStart=focused==='composer'?document.activeElement.selectionStart:null;const app=document.getElementById('app');const views={list:listView,chat:chatView,providers:providersView,provider:providerView,model:modelView,more:moreView,prefs:prefsView,diary:diaryView,diaryDetail:diaryDetailView,record:recordView};app.innerHTML=(views[S.page]||listView)()+modalView();document.getElementById('scenes').innerHTML=SCENES.map(([id,name],i)=>`<button class="scene ${S.scene===id?'active':''}" data-act="scene" data-id="${id}"><span class="number">0${i+1}</span><b>${name}</b>${icon('chevron')}</button>`).join('');document.getElementById('review').innerHTML=reviewView();const sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=scrollBottom?sc.scrollHeight:oldScroll;const sheet=document.querySelector('.sheet');if(sheet)sheet.scrollTop=sheetScroll;if(focused==='composer'){const input=document.getElementById('composer');input?.focus({preventScroll:true});if(selectionStart!==null)input?.setSelectionRange(selectionStart,selectionStart);} }
document.addEventListener('click',e=>{if(e.target.classList.contains('sheet-backdrop')){S.modal=null;render();return;}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,d=b.dataset;
 if(a==='scene')return scene(d.id);if(a==='reset')return reset();if(a==='new-chat')return newChat();if(a==='nav'){if(d.page==='diary-return')return returnFromDiary();if(d.page==='provider-return')return openProvider(S.providerId);return nav(d.page);}if(a==='return-chat')return nav('chat');if(a==='open-chat'){S.chatId=d.id;return nav('chat');}if(a==='send')return begin(S.input);if(a==='suggestion')return begin(d.text);if(a==='stop'){stop();return render();}if(a==='fail'){stop('failed');return render();}if(a==='complete')return complete();if(a==='retry')return begin('',d.id);
 if(a==='models'){if(!current())newChat();if(S.generating)S.modal={kind:'stopSwitch'};else S.modal={kind:'models'};return render();}if(a==='pick-model')return chooseModel(d.p,d.m);if(a==='confirm-switch')return chooseModel(S.modal.p,S.modal.m,true);if(a==='stop-then-model'){const o=S.modal;stop();S.modal={kind:'models'};return o.p?chooseModel(o.p,o.m):render();}if(a==='scope'){S.modal={kind:'scope'};return render();}if(a==='pick-scope'){current().scope=d.id;S.lastChange='已调整范围；已有引用快照仍保留。';return render();}if(a==='toggle-diary'){const c=current();c.custom=c.custom.includes(d.id)?c.custom.filter(x=>x!==d.id):[...c.custom,d.id];return render();}
 if(a==='close-modal'){S.modal=null;return render();}if(a==='chat-menu'){S.modal={kind:'chatMenu'};return render();}if(a==='ref'){S.modal={kind:'ref',msg:d.msg,index:Number(d.index)};return render();}if(a==='source'){S.modal={kind:'source',id:d.id};return render();}if(a==='diary')return openDiary(d.id);if(a==='toggle-refs'){const msg=findMessage(d.id);msg.refsExpanded=!msg.refsExpanded;return render();}if(a==='current-model'){const {p,m}=selected(current().selection);if(!p||!m){S.modal={kind:'models'};return render();}stop();return openModel(p.id,m.uid);}
 if(a==='provider')return openProvider(d.id);if(a==='add-provider')return openProvider(null);if(a==='demo-key'){S.draft.key='DEMO_ONLY';render();return toast('已填入无效的演示密钥，不会发往任何服务');}if(a==='save-provider')return saveProvider();if(a==='confirm-address')return saveProvider(true);if(a==='edit-model'||a==='add-model'){const draft=S.draft,p=provider(draft.id);if(!p){toast('请先保存服务商，再添加模型');return;}if(JSON.stringify(p)!==JSON.stringify(draft)){toast('配置尚未保存，请先保存后再编辑模型');return;}return openModel(p.id,a==='edit-model'?d.m:null);}if(a==='save-model')return saveModel();if(a==='toggle-thinking'){S.draft.thinking=!S.draft.thinking;return render();}if(a==='effort'){S.draft.effort=d.value;return render();}if(a==='set-default'){S.selectionDefault={p:S.providerId,m:S.modelUid};S.lastChange='已设为新对话默认模型；已有聊天不变。';render();return toast('已设为默认模型');}if(a==='default-model'){S.modal={kind:'defaults'};return render();}if(a==='pick-default'){S.selectionDefault={p:d.p,m:d.m};S.modal=null;S.lastChange='默认模型已更新，只影响新对话。';return render();}
 if(a==='delete-provider'){S.modal={kind:'deleteProvider',id:d.id};return render();}if(a==='delete-model'){S.modal={kind:'deleteModel',id:d.id,p:d.p};return render();}if(a==='confirm-delete')return remove(d.kind,d.id,d.p);if(a==='delete-chat-confirm'){S.modal={kind:'deleteChat'};return render();}if(a==='delete-chat'){stop();S.chats=S.chats.filter(c=>c.id!==S.chatId);S.chatId=S.chats[0]?.id;S.page='list';S.modal=null;S.lastChange='这段聊天已删除；演示日记没有被删除。';return render();}
 if(a==='test'){S.modal={kind:'test'};return render();}if(a==='run-test'){S.modal.result=S.draft.auth==='key'&&!S.draft.key?'missing':'ok';return render();}if(a==='reset-prompt'){S.systemPrompt=SYS_PROMPT;return render();}if(a==='prefs-done'){S.lastChange='对话指引已更新。';return nav('providers');}
 if(a==='remove-source'){const refs=current()?.messages.flatMap(m=>m.refs||[])||[];const id=refs.find(r=>!S.diaries.find(d=>d.id===r.id)?.deleted)?.id;if(!id)return toast('当前没有可演示删除的引用源日记');S.diaries.find(d=>d.id===id).deleted=true;S.lastChange='演示源日记已删除。点击原回答下方引用，仍能查看当时快照。';render();return toast('源日记已删除，聊天引用仍保留');}
 if(a==='walk'){if(S.walk>=5){scene('edge');return;}if(S.walk===0){S.walk++;begin('我想从一件小事开始，你有什么建议？');}else if(S.walk===1){stop();S.walk++;render();}else if(S.walk===2){S.walk++;begin('接着刚才的内容说说，可以吗？');}else if(S.walk===3){stop('failed');S.walk++;render();}else if(S.walk===4){const last=current().messages.filter(m=>m.role==='assistant').at(-1);S.walk++;begin('',last.id);}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!S.generating)begin(S.input);}});
document.getElementById('brand-dango').innerHTML=dango(28);render();
</script>
